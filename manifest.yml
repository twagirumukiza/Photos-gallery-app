name: Générer la liste des photos

on:
  push:
    paths: ["photos/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer photos/manifest.json
        run: |
          cd photos
          ls -1 | grep -iE '\.(jpe?g|png|gif|webp|avif)$' | sort -V | jq -R . | jq -s . > manifest.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add photos/manifest.json
          git diff --cached --quiet || (git commit -m "chore: maj manifest photos" && git push)
